name: Windows Build

on:
  push:
    branches: [main, ezzcloud, ezzcloud-rebrand, ezzcloud-fresh]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: windows-amd64

      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install --no-frozen-lockfile

      - name: Disable updater artifacts and embed WebView2 bootstrapper
        working-directory: desktop
        shell: pwsh
        run: |
          $cfg = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $cfg.bundle.createUpdaterArtifacts = $false
          if (-not $cfg.bundle.windows) { $cfg.bundle | Add-Member -NotePropertyName windows -NotePropertyValue ([pscustomobject]@{}) -Force }
          $cfg.bundle.windows | Add-Member -NotePropertyName webviewInstallMode -NotePropertyValue ([pscustomobject]@{ type = "embedBootstrapper" }) -Force
          $cfg | ConvertTo-Json -Depth 32 | Set-Content src-tauri/tauri.conf.json

      - name: Build Tauri (Windows .exe + .msi)
        working-directory: desktop
        run: pnpm tauri build --bundles nsis,msi

      - name: Create portable exe (raw, no installer)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "desktop/src-tauri/target/release/*.exe" -File | Where-Object { $_.Name -notlike "*setup*" } | Select-Object -First 1
          if (-not $exe) { throw "No raw .exe found in target/release" }
          $dest = "desktop/src-tauri/target/release/bundle/portable"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item $exe.FullName "$dest/EzzCloud-portable.exe"
          Get-ChildItem $dest

      # ── Premium custom installer (Tauri-based bootstrapper) ──
      - name: Stage payload for premium installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop-installer/src-tauri/payload | Out-Null
          Copy-Item desktop/src-tauri/target/release/bundle/portable/EzzCloud-portable.exe desktop-installer/src-tauri/payload/EzzCloud.exe -Force
          Get-ChildItem desktop-installer/src-tauri/payload

      - name: Install installer frontend deps
        working-directory: desktop-installer
        run: pnpm install --no-frozen-lockfile

      - name: Rust cache (installer)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-installer/src-tauri -> target
          key: windows-amd64-installer

      - name: Build premium installer
        working-directory: desktop-installer
        run: pnpm tauri build --bundles nsis

      - name: Stage premium installer output
        shell: pwsh
        run: |
          $src = Get-ChildItem -Path "desktop-installer/src-tauri/target/release/bundle/nsis/*.exe" -File | Select-Object -First 1
          if (-not $src) { throw "No premium installer .exe produced" }
          $dest = "desktop/src-tauri/target/release/bundle/premium"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item $src.FullName "$dest/EzzCloud-Setup.exe"
          Get-ChildItem $dest

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EzzCloud-windows-x86_64
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/portable/*.exe
            desktop/src-tauri/target/release/bundle/premium/*.exe
          retention-days: 90
